<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Uji brand-mark.svg</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 24px; }
    .row { display: flex; align-items: flex-end; gap: 32px; margin-bottom: 24px; }
    .box { text-align: center; font-size: 14px; }
    .dark { background: #1f2937; color: #fff; padding: 16px; }
  </style>
</head>
<body>
  <h1>Uji keterbacaan brand-mark.svg</h1>

  <div class="row">
    <div class="box"><img src="../../optimized-assets/brand-mark.svg" width="24" height="24" alt="Logo 24 px"><br>24 px</div>
    <div class="box"><img src="../../optimized-assets/brand-mark.svg" width="48" height="48" alt="Logo 48 px"><br>48 px</div>
    <div class="box"><img src="../../optimized-assets/brand-mark.svg" width="128" height="128" alt="Logo 128 px"><br>128 px</div>
  </div>

  <!-- opsional: uji kontras di latar gelap -->
  <div class="row dark">
    <div class="box"><img src="../../optimized-assets/brand-mark.svg" width="24" height="24" alt=""><br>24 px</div>
    <div class="box"><img src="../../optimized-assets/brand-mark.svg" width="48" height="48" alt=""><br>48 px</div>
    <div class="box"><img src="../../optimized-assets/brand-mark.svg" width="128" height="128" alt=""><br>128 px</div>
  </div>
</body>
</html>
