<!DOCTYPE html>
<html lang="id">
<head>

  <title>Perbandingan hero</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }

    figcaption { font-size: 14px; padding: 4px 0; }

<body>
  <div class="row">
    <figure><figcaption>Pembanding (PNG lossless) - 736 px</figcaption><img src="../../source-assets/product-3-original.jpg" alt=""></figure>
    <figure><figcaption>JPEG q75 - 22.0 KB</figcaption><img src="../../optimized-assets/product-3-optimized.jpg" alt=""></figure>
    <figure><figcaption>WebP q75 - 12.1 KB</figcaption><img src="../../optimized-assets/product-3-optimized.webp" alt=""></figure>
  </div>
</body>
</html>
